name: Diagnose POS

on:
  workflow_dispatch:
  push:
    paths:
      - 'diagnose-pos.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract POS functions
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for m in re.finditer(r'function\\s+([A-Za-z_$][\\w$]*)\\s*\\([^)]*\\)\\s*\\{',s):
              name=m.group(1)
              if any(k in name.lower() for k in ('pos','table','masa','order','ticket','adisyon','product')):
                  a=max(0,m.start()-300); b=min(len(s),m.start()+5000)
                  out.append('### '+name+'\\n'+s[a:b])
          Path('pos-diagnostic.txt').write_text('\\n\\n'.join(out),encoding='utf-8')
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pos-diagnostic.txt
          git commit -m "chore: add POS diagnostic"
          git push
