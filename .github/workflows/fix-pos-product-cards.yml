name: Fix POS product cards
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[pos-product-cards-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch POS product loading and visibility
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old = """async function openPOSTable(tableId){
  posCurrentTable=posTables.find(t=>String(t.id)===String(tableId)); if(!posCurrentTable)return;
  posCurrentOrder=activeOrderForTable(tableId);"""
          new = """async function openPOSTable(tableId){
  posCurrentTable=posTables.find(t=>String(t.id)===String(tableId)); if(!posCurrentTable)return;
  if(typeof loadPOSCatalog==="function"){
    const ok=await loadPOSCatalog();
    if(!ok)return;
  }
  posCurrentOrder=activeOrderForTable(tableId);"""
          if old in s and "const ok=await loadPOSCatalog();" not in s:
              s=s.replace(old,new,1)

          marker = """  renderPOSCategories(); renderPOSProducts(); renderPOSTicket();
}"""
          replacement = """  renderPOSCategories();
  renderPOSProducts();
  const posGrid=document.getElementById("posProductGrid");
  if(posGrid)posGrid.style.display="grid";
  renderPOSTicket();
}"""
          if marker in s and 'posGrid.style.display="grid"' not in s:
              s=s.replace(marker,replacement,1)

          css = """<style id="pos-product-card-visibility-fix">
#posPanel #posProductGrid{display:grid!important;visibility:visible!important;opacity:1!important;}
#posPanel .pos-product-card{display:flex!important;visibility:visible!important;opacity:1!important;}
</style>"""
          if 'id="pos-product-card-visibility-fix"' not in s:
              s=s.replace("</body>",css+"</body>",1)

          p.write_text(s,encoding="utf-8")

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-pos-product-cards.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix POS product cards visibility [pos-product-cards-fixed]"
          git push
