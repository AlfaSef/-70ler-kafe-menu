name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'index.html'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 70ler-Kafe-Personel-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare stable APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 70ler-Kafe-Personel.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 70ler-Kafe-Personel.apk --clobber
          else
            gh release create v1.0.0 70ler-Kafe-Personel.apk --title "70'ler Kafe Personel v1.0.0" --notes "Android personel uygulaması."
          fi
