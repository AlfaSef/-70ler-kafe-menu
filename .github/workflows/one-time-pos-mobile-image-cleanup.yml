name: One-time POS mobile and image cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[pos-cleanup-done]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove product image upload UI.
          s = s.replace('<label>Fotoğraf<input id="pImage" type="file" accept="image/*"></label>\n', '')
          s = s.replace('pImage.value="";', '')

          # Remove the Supabase Storage upload block from saveProduct().
          s = re.sub(
              r'\s*let imageUrl=null;\s*const file=pImage\.files\[0\];\s*if\(file\)\{.*?\n\s*\}\s*',
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          s = s.replace('    if(imageUrl)payload.image_url=imageUrl;\n', '')

          # Product-image display rules requested by the user.
          marker = 'const price=p.price!=null?Number(p.price).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" TL":"Fiyat bilgisi";'
          if marker in s and 'const displayImageUrl = (() =>' not in s:
              extra = marker + '''\n  const displayImageUrl = (() => {\n    const n = String(p.name||"").trim().toLocaleLowerCase("tr-TR");\n    if(n === "pesto soslu makarna") return "https://images.70lerkafe.com/products/PESTO%20SOSLU%20MAKARNA%20KARE.png";\n    if(n === "üçgen mantı") return "https://images.70lerkafe.com/products/sinop%20mantı.png";\n    if(n.includes("çi börek") || n.includes("çibörek")) return "https://images.70lerkafe.com/products/çi%20börek.png";\n    const cat = categories.find(c=>String(c.id)===String(p.category_id));\n    const catName = String(cat?.name||"").trim().toLocaleLowerCase("tr-TR");\n    if(catName.includes("kampanyalı menüler")) return "";\n    return p.image_url || "";\n  })();'''
              s = s.replace(marker, extra, 1)

          old_img = '${p.image_url?`<img src="${escAttr(p.image_url)}" alt="${escAttr(p.name)}" loading="lazy">`:`<div class="photo-placeholder">Fotoğraf<br>eklenmemiş</div>`}'
          new_img = '${displayImageUrl?`<img src="${escAttr(displayImageUrl)}" alt="${escAttr(p.name)}" loading="lazy">`:`<div class="photo-placeholder">Fotoğraf<br>eklenmemiş</div>`}'
          s = s.replace(old_img, new_img)

          # Final mobile POS override. Existing later desktop/reference rules force a
          # 3-column topbar with a 320px minimum column, causing the screenshot's
          # horizontal overflow on iPhone. This rule is intentionally appended last.
          mobile_css = r'''\n<style id="pos-mobile-final-fix">\nhtml,body{overflow-x:hidden!important;max-width:100%!important}\n#posPanel.pos-shell{width:100vw!important;max-width:100vw!important;overflow:hidden!important}\n#posPanel .pos-app,#posPanel .pos-main{min-width:0!important;width:100%!important;max-width:100%!important}\n@media(max-width:600px){\n  #posPanel .pos-topbar{grid-template-columns:minmax(0,1fr)!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important;padding:0 10px!important}\n  #posPanel .pos-topbar-left{min-width:0!important;width:100%!important}\n  #posPanel .pos-topbar-left h1{font-size:19px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}\n  #posPanel .pos-top-search-wrap,#posPanel .pos-topbar-right{display:none!important}\n  #posPanel .pos-table-section{padding:8px 10px!important}\n  #posPanel .pos-table-grid{width:100%!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}\n  #posPanel .pos-table-card{min-width:0!important;width:100%!important;box-sizing:border-box!important}\n  #posPanel .pos-order-topbar{display:grid!important;grid-template-columns:1fr auto!important;gap:8px!important;padding:9px 10px 0!important}\n  #posPanel .pos-order-topbar .pos-selected-table{grid-column:1/-1!important;grid-row:1!important;font-size:15px!important}\n  #posPanel .pos-order-topbar .btn{grid-column:1!important;grid-row:2!important;min-width:0!important}\n  #posPanel .pos-order-topbar .pos-order-status{grid-column:2!important;grid-row:2!important;justify-self:end!important}\n  #posPanel .pos-workspace{display:flex!important;flex-direction:column!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important;padding:0 10px 12px!important;gap:10px!important}\n  #posPanel .pos-products-panel,#posPanel .pos-ticket-panel{width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important}\n  #posPanel .pos-products-panel{min-height:0!important}\n  #posPanel .pos-product-grid{width:100%!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;max-height:420px!important;box-sizing:border-box!important}\n  #posPanel .pos-ticket-panel{height:auto!important;min-height:0!important}\n  #posPanel .ticket-actions{grid-template-columns:1fr!important}\n  #posPanel .print-btn{grid-column:auto!important}\n}\n</style>\n'''
          if 'id="pos-mobile-final-fix"' not in s:
              s = s.replace('</body>', mobile_css + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          print('index.html patched')

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/one-time-pos-mobile-image-cleanup.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: mobile POS and product image cleanup [pos-cleanup-done]"
          git push
